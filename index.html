<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동물 캐릭터 프롬프트 생성기</title>
  <style>
    /* 동물/상상 캐릭터 테마 (밝고 귀여운 민트/에메랄드 톤) */
    :root {
      --primary: #10b981;
      --bg: #ecfdf5;
      --card-bg: #ffffff;
      --border: #a7f3d0;
      --text: #064e3b;
      --select-card-bg: #d1fae5;
      --base-font-size: 18px; /* 어르신들을 위해 기본 글자 크기 확대 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 16px;
      font-size: var(--base-font-size);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 2px solid var(--border);
    }

    /* 헤더 영역 & 글자 크기 조절 바 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.3em;
      margin: 0;
      color: var(--primary);
    }

    /* 글자 크기 조절 버튼 스타일 */
    .font-size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--select-card-bg);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .font-size-control span {
      font-weight: bold;
      font-size: 0.9em;
    }

    .btn-size {
      background: var(--primary);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .btn-size:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 1.1em;
      font-weight: bold;
      color: var(--primary);
      margin-top: 24px;
      margin-bottom: 12px;
      grid-column: 1 / -1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 700;
      font-size: 0.95em;
    }

    select, input {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.95em;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    .custom-input {
      margin-top: 6px;
      display: none;
    }

    .output-section {
      margin-top: 28px;
      padding: 16px;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .output-title {
      font-weight: bold;
      font-size: 1em;
      color: var(--primary);
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      resize: vertical;
      font-size: 0.95em;
      box-sizing: border-box;
      outline: none;
      line-height: 1.5;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더 & 글자 크기 조절 컨트롤 -->
  <div class="header-bar">
    <h1>🐾 동물 캐릭터 프롬프트 생성기</h1>
    
    <div class="font-size-control">
      <span>글자크기</span>
      <button type="button" class="btn-size" id="btn-decrease" onclick="changeFontSize(-2)">-</button>
      <span id="font-size-display">18px</span>
      <button type="button" class="btn-size" id="btn-increase" onclick="changeFontSize(2)">+</button>
    </div>
  </div>
  
  <div class="grid">
    <!-- ================= [동물/상상 캐릭터 전용 폼] ================= -->
    
    <!-- 1. 캐릭터 종류 -->
    <div class="form-group">
      <label for="a1">1. 캐릭터 종류</label>
      <select id="a1" onchange="updateBreedOptions(); handleSelectChange(this, 'a1_custom');">
        <option value="강아지">강아지</option>
        <option value="고양이">고양이</option>
        <option value="귀여운 토끼">토끼</option>
        <option value="귀여운 곰">곰</option>
        <option value="귀여운 다람쥐">다람쥐</option>
        <option value="용맹한 사자">사자</option>
        <option value="멋진 호랑이">호랑이</option>
        <option value="귀여운 펭귄">펭귄</option>
        <option value="신비로운 아기 용">아기 용</option>
        <option value="유니콘">유니콘</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="text" id="a1_custom" class="custom-input" placeholder="동물/캐릭터 직접 입력" oninput="generatePrompt()">
    </div>

    <!-- 1-1. 품종 선택 (강아지/고양이 선택 시 나타남) -->
    <div class="form-group" id="a1_breed_group" style="display: none;">
      <label for="a1_breed">▶ 품종 선택</label>
      <select id="a1_breed" onchange="handleSelectChange(this, 'a1_breed_custom')">
        <!-- JS로 동적 생성 -->
      </select>
      <input type="text" id="a1_breed_custom" class="custom-input" placeholder="품종 직접 입력" oninput="generatePrompt()">
    </div>

    <!-- 2. 표현 방식 -->
    <div class="form-group">
      <label for="a2">2. 표현 방식</label>
      <select id="a2" onchange="toggleAnthropomorphic(); generatePrompt();">
        <option value="anthropomorphic">의인화 (직업과 옷을 입음)</option>
        <option value="cute_animal">본래 모습의 귀여운 동물</option>
      </select>
    </div>

    <!-- 3. 직업 -->
    <div class="form-group" id="a3-group">
      <label for="a3">3. 직업</label>
      <select id="a3" onchange="updateClothesOptions(); handleSelectChange(this, 'a3_custom');">
        <option value="가수">가수</option>
        <option value="배우">배우</option>
        <option value="탐정">탐정</option>
        <option value="의사">의사</option>
        <option value="요리사">요리사</option>
        <option value="카페 바리스타">카페 바리스타</option>
        <option value="학생">학생</option>
        <option value="우주비행사">우주비행사</option>
        <option value="마법사">마법사</option>
        <option value="기사">기사</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="text" id="a3_custom" class="custom-input" placeholder="직업 직접 입력" oninput="generatePrompt()">
    </div>

    <!-- 4. 옷 종류 (직업 연동) -->
    <div class="form-group" id="a4-group">
      <label for="a4">4. 의상 / 옷 종류</label>
      <select id="a4" onchange="handleSelectChange(this, 'a4_custom')">
        <!-- JS로 동적 생성 -->
      </select>
      <input type="text" id="a4_custom" class="custom-input" placeholder="의상 직접 입력" oninput="generatePrompt()">
    </div>

    <!-- 5. 행동 / 포즈 -->
    <div class="form-group">
      <label for="a5">5. 행동 / 포즈</label>
      <select id="a5" onchange="handleSelectChange(this, 'a5_custom')">
        <option value="앙증맞게 앉아있는 포즈">앙증맞게 앉아있기</option>
        <option value="손을 흔들며 인사하는 포즈">손 흔들며 인사하기</option>
        <option value="음식을 맛있게 먹고 있는 포즈">음식 먹고 있기</option>
        <option value="마이크를 잡고 열창하는 포즈">마이크 잡고 열창하기</option>
        <option value="멋진 카리스마 넘치는 포즈">카리스마 넘치는 포즈</option>
        <option value="돋보기를 들고 탐색하는 포즈">돋보기로 조사하기</option>
        <option value="마법 지팡이를 휘두르는 포즈">마법 지팡이 휘두르기</option>
        <option value="신나게 뛰어오르는 포즈">신나게 뛰어오르기</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="text" id="a5_custom" class="custom-input" placeholder="행동 직접 입력" oninput="generatePrompt()">
    </div>

    <!-- 6. 그림 스타일 -->
    <div class="form-group">
      <label for="a6">6. 그림 스타일</label>
      <select id="a6" onchange="generatePrompt()">
        <option value="수채화 스타일">수채화</option>
        <option value="유화 스타일">유화</option>
        <option value="연필 에칭 스타일">연필 에칭</option>
        <option value="시네마틱 스타일">시네마틱</option>
        <option value="빈티지/레트로 스타일">빈티지/레트로</option>
        <option value="흑백 스타일">흑백</option>
        <option value="3D 애니메이션 스타일">3D 애니메이션</option>
        <option value="귀여운 3D 토이 스타일">귀여운 3D 토이</option>
        <option value="플랫 일러스트 스타일">플랫 일러스트</option>
        <option value="손그림 감성 일러스트 스타일">손그림 감성 일러스트</option>
        <option value="귀여운 만화 스타일">귀여운 만화 스타일</option>
        <option value="한국 웹툰 스타일">한국 웹툰</option>
        <option value="일본 애니메이션 스타일">일본 애니메이션</option>
      </select>
    </div>

    <!-- 7. 신체 비율 -->
    <div class="form-group">
      <label for="a7">7. 신체 비율</label>
      <select id="a7" onchange="generatePrompt()">
        <option value="chibi 2-head scale proportion">2등신 SD (Chibi)</option>
        <option value="cute character ratio">자연스러운 동화 비율</option>
      </select>
    </div>

    <!-- ================= [공통 설정 폼] ================= -->
    <div class="section-title">📷 사진 / 구도 설정</div>

    <div class="form-group">
      <label for="common_shot">촬영 범위</label>
      <select id="common_shot" onchange="generatePrompt()">
        <option value="close-up shoulder-up headshot portrait">어깨까지 (Headshot / Shoulder-up)</option>
        <option value="medium waist-up shot">허리까지 (Waist-up / Medium shot)</option>
        <option value="full body shot">전신 (Full body)</option>
        <option value="wide angle shot">와이드 샷 (Wide angle)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="common_view">시선 / 방향</label>
      <select id="common_view" onchange="generatePrompt()">
        <option value="정면 바라보는 구도">정면</option>
        <option value="측면 구도">측면</option>
      </select>
    </div>

    <div class="form-group">
      <label for="common_aspect">사진 방향</label>
      <select id="common_aspect" onchange="generatePrompt()">
        <option value="세로 방향 사진">세로 사진</option>
        <option value="가로 방향 사진">가로 사진</option>
      </select>
    </div>

    <div class="form-group">
      <label for="common_bg">배경</label>
      <select id="common_bg" onchange="handleSelectChange(this, 'common_bg_custom')">
        <option value="흰색 배경">흰색 배경</option>
        <option value="단색 배경">단색 배경</option>
        <option value="아늑한 카페 배경">카페</option>
        <option value="아늑한 숲속 배경">숲속</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="text" id="common_bg_custom" class="custom-input" placeholder="배경 직접 입력" oninput="generatePrompt()">
    </div>
  </div>

  <!-- 결과 출력 섹션 -->
  <div class="output-section">
    <div class="output-header">
      <span class="output-title">생성된 프롬프트</span>
      <button class="btn" onclick="copyPrompt()">복사하기</button>
    </div>
    <textarea id="result" readonly></textarea>
  </div>
</div>

<script>
  // 글자 크기 조절 설정 (최저: 14px, 최고: 26px)
  let currentFontSize = 18;
  const MIN_FONT_SIZE = 14;
  const MAX_FONT_SIZE = 26;

  function changeFontSize(delta) {
    currentFontSize += delta;

    if (currentFontSize < MIN_FONT_SIZE) currentFontSize = MIN_FONT_SIZE;
    if (currentFontSize > MAX_FONT_SIZE) currentFontSize = MAX_FONT_SIZE;

    document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
    document.getElementById('font-size-display').textContent = currentFontSize + 'px';

    // 최저/최고 크기 달성 시 버튼 비활성화 처리
    document.getElementById('btn-decrease').disabled = (currentFontSize <= MIN_FONT_SIZE);
    document.getElementById('btn-increase').disabled = (currentFontSize >= MAX_FONT_SIZE);
  }

  const clothesByJob = {

    ],
    "우주비행사": [
      { text: "첨단 렌더링 우주복", val: "첨단 우주복" },
      { text: "귀여운 아카데미 우주 비행 수트", val: "귀여운 우주 비행 수트" }
    ],
    "마법사": [
      { text: "화려한 문양의 마법사 로브와 뾰족 모자", val: "화려한 마법사 로브와 뾰족 모자" },
      { text: "신비로운 판초 망토", val: "신비로운 판초 망토" }
    ],
    "기사": [
      { text: "반짝이는 은빛 갑옷", val: "반짝이는 은빛 갑옷" },
      { text: "중세 기사 제복과 망토", val: "중세 기사 제복과 망토" }
    ]
  };

  // 품종 Dropdown 동적 업데이트
  function updateBreedOptions() {
    const animalVal = document.getElementById("a1").value;
    const breedGroup = document.getElementById("a1_breed_group");
    const breedSelect = document.getElementById("a1_breed");

    if (animalVal === "강아지" || animalVal === "고양이") {
      breedGroup.style.display = "flex";
      breedSelect.innerHTML = "";

      const list = breedsByAnimal[animalVal];
      list.forEach(opt => {
        const el = document.createElement("option");
        el.value = opt.val;
        el.textContent = opt.text;
        breedSelect.appendChild(el);
      });

      const customOpt = document.createElement("option");
      customOpt.value = "custom";
      customOpt.textContent = "직접 입력";
      breedSelect.appendChild(customOpt);

      handleSelectChange(breedSelect, "a1_breed_custom");
    } else {
      breedGroup.style.display = "none";
      document.getElementById("a1_breed_custom").style.display = "none";
      generatePrompt();
    }
  }

  function updateClothesOptions() {
    const jobVal = getValue("a3", "a3_custom");
    const clothesSelect = document.getElementById("a4");
    clothesSelect.innerHTML = "";

    const list = clothesByJob[jobVal] || [
      { text: "직업에 어울리는 깔끔한 유니폼", val: "직업에 어울리는 깔끔한 유니폼" },
      { text: "편안한 캐주얼 의상", val: "편안한 캐주얼 의상" }
    ];

    list.forEach(opt => {
      const el = document.createElement("option");
      el.value = opt.val;
      el.textContent = opt.text;
      clothesSelect.appendChild(el);
    });

    const customOpt = document.createElement("option");
    customOpt.value = "custom";
    customOpt.textContent = "직접 입력";
    clothesSelect.appendChild(customOpt);

    handleSelectChange(clothesSelect, "a4_custom");
  }

  function toggleAnthropomorphic() {
    const isAnthro = document.getElementById("a2").value === "anthropomorphic";
    document.getElementById("a3-group").style.display = isAnthro ? "flex" : "none";
    document.getElementById("a4-group").style.display = isAnthro ? "flex" : "none";
    if (isAnthro) {
      updateClothesOptions();
    }
  }

  function handleSelectChange(selectEl, customInputId) {
    const inputEl = document.getElementById(customInputId);
    if (selectEl.value === "custom") {
      inputEl.style.display = "block";
    } else {
      inputEl.style.display = "none";
      inputEl.value = "";
    }
    generatePrompt();
  }

  function getValue(selectId, customInputId) {
    const selectEl = document.getElementById(selectId);
    if (selectEl && selectEl.value === "custom") {
      const customVal = document.getElementById(customInputId).value.trim();
      return customVal !== "" ? customVal : "";
    }
    return selectEl ? selectEl.value : "";
  }

  function generatePrompt() {
    let parts = [];

    const animalType = document.getElementById("a1").value;
    if (animalType === "강아지" || animalType === "고양이") {
      parts.push(getValue("a1_breed", "a1_breed_custom"));
    } else {
      parts.push(getValue("a1", "a1_custom"));
    }
    
    const isAnthro = document.getElementById("a2").value === "anthropomorphic";
    if (isAnthro) {
      parts.push("의인화된 캐릭터");
      parts.push(getValue("a3", "a3_custom"));
      parts.push(getValue("a4", "a4_custom"));
    } else {
      parts.push("본래 모습의 귀여운 동물");
    }

    parts.push(getValue("a5", "a5_custom"));
    parts.push(getValue("a6"));
    parts.push(getValue("a7"));

    parts.push(
      getValue("common_shot"),
      getValue("common_view"),
      getValue("common_aspect"),
      getValue("common_bg", "common_bg_custom")
    );

    const filteredParts = parts.filter(p => p !== "");
    document.getElementById("result").value = filteredParts.join(", ");
  }

  function copyPrompt() {
    const textarea = document.getElementById("result");
    textarea.select();
    document.execCommand("copy");
    alert("프롬프트가 클립보드에 복사되었습니다!");
  }

  window.onload = function() {
    updateBreedOptions();
    toggleAnthropomorphic();
  };
</script>
